- name: Invalidate completion marker until provisioning succeeds
  ansible.builtin.file:
    path: "{{ policy_dir }}/managed"
    state: absent

- name: Check user-owned directories before privileged writes
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - /home/dev
    - /home/dev/.ssh
    - /home/dev/.codex
    - /home/dev/.claude
    - /home/dev/.config
    - /home/dev/projects
  register: dev_directories

- name: Refuse redirected or non-directory development paths
  ansible.builtin.assert:
    that: not item.stat.exists or (item.stat.isdir and not item.stat.islnk)
    fail_msg: "Refusing unsafe directory {{ item.item }}"
    quiet: true
  loop: "{{ dev_directories.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Require Lima's expected account identity
  ansible.builtin.getent:
    database: passwd
    key: dev

- name: Check account home and UID
  ansible.builtin.assert:
    that:
      - ansible_facts.getent_passwd.dev[1] == '1000'
      - ansible_facts.getent_passwd.dev[4] == '/home/dev'

- name: Remove supplementary groups and lock development password
  ansible.builtin.user:
    name: dev
    groups: ''
    append: false
    password_lock: true

- name: Deny development sudo access
  ansible.builtin.copy:
    dest: /etc/sudoers.d/99-devwright-dev
    content: "dev ALL=(ALL:ALL) !ALL\n"
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s

- name: Validate combined sudo configuration
  ansible.builtin.command: /usr/sbin/visudo -cf /etc/sudoers
  changed_when: false

- name: Protect administrator home
  ansible.builtin.file:
    path: /root
    state: directory
    mode: '0700'

- name: Create private development directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: dev
    group: dev
    mode: '0700'
  loop: [/home/dev, /home/dev/.ssh, /home/dev/.codex, /home/dev/.claude, /home/dev/.config]

- name: Create project directory
  ansible.builtin.file:
    path: /home/dev/projects
    state: directory
    owner: dev
    group: dev
    mode: '0755'

- name: Create administrator-owned configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: ["{{ policy_dir }}", /etc/codex, /etc/claude-code, /etc/apt/keyrings, /usr/local/share/codex]

- name: Configure guest SSH restrictions
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-devwright.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      PermitRootLogin prohibit-password
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AllowAgentForwarding no
      X11Forwarding no

- name: Remove bootstrap SSH drop-in
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/00-devwright-root.conf
    state: absent

- name: Validate SSH configuration before reload
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false

- name: Apply guest SSH policy
  ansible.builtin.service:
    name: ssh
    state: reloaded

- name: Install base and project packages from current apt repositories
  ansible.builtin.apt:
    update_cache: true
    name: "{{ ['ca-certificates', 'curl', 'git', 'gh', 'jq', 'ripgrep', 'build-essential', 'gzip', 'zsh', 'unzip', 'bubblewrap', 'apparmor', 'gnupg', 'socat'] + packages }}"
    state: latest
    install_recommends: false
    lock_timeout: 180

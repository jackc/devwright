- name: Install selected policies and seed or explicitly replace personal settings
  ansible.builtin.shell: "{{ lookup('ansible.builtin.template', 'templates/policies.sh.j2') }}"
  args:
    executable: /bin/bash
  # Reuse the tested atomic policy selection and migration semantics.

- name: Download current Codex installer
  ansible.builtin.get_url:
    url: https://chatgpt.com/codex/install.sh
    dest: "{{ policy_dir }}/install-codex.sh"
    mode: '0644'
    force: true

- name: Install current Codex as root outside the administrator home
  ansible.builtin.command: "sh {{ policy_dir }}/install-codex.sh --release latest"
  environment:
    CODEX_HOME: /usr/local/share/codex
    CODEX_INSTALL_DIR: /usr/local/bin
    CODEX_NON_INTERACTIVE: '1'

- name: Configure bubblewrap AppArmor compatibility
  ansible.builtin.script: "{{ playbook_dir }}/files/apparmor.sh"
  args:
    executable: /bin/bash

- name: Download Claude repository signing key for inspection
  ansible.builtin.get_url:
    url: https://downloads.claude.ai/keys/claude-code.asc
    dest: "{{ policy_dir }}/claude-code.asc"
    mode: '0644'
    force: true

- name: Inspect repository key fingerprint
  ansible.builtin.command: "gpg --batch --with-colons --show-keys {{ policy_dir }}/claude-code.asc"
  register: claude_key
  changed_when: false

- name: Require the expected Anthropic signing key
  ansible.builtin.assert:
    that: (claude_key.stdout_lines | select('match', '^fpr:') | first).split(':')[9] == '31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE'

- name: Trust the inspected key
  ansible.builtin.copy:
    src: "{{ policy_dir }}/claude-code.asc"
    remote_src: true
    dest: /etc/apt/keyrings/claude-code.asc
    owner: root
    group: root
    mode: '0644'

- name: Configure Claude's latest apt channel
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/claude-code.list
    mode: '0644'
    content: "deb [signed-by=/etc/apt/keyrings/claude-code.asc] https://downloads.claude.ai/claude-code/apt/latest latest main\n"

- name: Install or update Claude Code
  ansible.builtin.apt:
    name: claude-code
    state: latest
    update_cache: true
    install_recommends: false
    lock_timeout: 180

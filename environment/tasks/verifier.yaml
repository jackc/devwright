- name: Copy existing acceptance verifier for guest architecture
  ansible.builtin.copy:
    src: "{{ repo_root }}/guestbin/verify-linux-{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}.gz"
    dest: "{{ policy_dir }}/verify.gz"
    mode: '0644'

- name: Install executable verifier atomically
  ansible.builtin.shell: |
    set -euo pipefail
    tmp=$(mktemp {{ policy_dir }}/verify.XXXXXXXX)
    trap 'rm -f "$tmp"' EXIT
    gzip -dc {{ policy_dir }}/verify.gz > "$tmp"
    chmod 755 "$tmp"
    mv -f "$tmp" {{ policy_dir }}/verify
  args:
    executable: /bin/bash

- name: Read installed agent versions as development user
  ansible.builtin.command:
    argv: [sudo, -u, dev, -H, "{{ item.command }}", --version]
  loop:
    - {command: /usr/local/bin/codex, name: codex}
    - {command: /usr/bin/claude, name: claude}
  register: agent_versions
  changed_when: false

- name: Record installed versions
  ansible.builtin.copy:
    dest: "{{ policy_dir }}/{{ item.item.name }}-version"
    content: "{{ item.stdout }}\n"
    mode: '0644'
  loop: "{{ agent_versions.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Mark completed provisioning
  ansible.builtin.copy:
    dest: "{{ policy_dir }}/managed"
    content: "devwright-v1\n"
    mode: '0644'

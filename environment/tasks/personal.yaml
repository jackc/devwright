- name: Configure GitHub HTTPS authentication
  ansible.builtin.script: "{{ playbook_dir }}/files/git.sh"
  args:
    executable: /bin/bash

- name: Install shared dotfiles and credential-hook helpers
  ansible.builtin.copy:
    src: "{{ repo_root }}/lima/{{ item.source }}"
    dest: "{{ policy_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: '0755'
  loop:
    - {source: dotfiles.sh, dest: dotfiles.sh}
    - {source: credentials.sh, dest: setup-credentials.sh}

- name: Transfer and install optional host-authenticated dotfiles
  when: dotfiles_repo | length > 0
  block:
    - name: Allocate private bundle staging directory
      ansible.builtin.tempfile:
        state: directory
        prefix: devwright-dotfiles.
      register: guest_bundle
    - name: Copy committed Git objects without host credentials
      ansible.builtin.copy:
        src: "{{ dotfiles_bundle }}"
        dest: "{{ guest_bundle.path }}/dotfiles.bundle"
        mode: '0600'
    - name: Run independent installers for root and dev
      ansible.builtin.command:
        argv: [/bin/bash, "{{ policy_dir }}/dotfiles.sh", "{{ dotfiles_repo }}", "{{ dotfiles_install }}", "{{ guest_bundle.path }}/dotfiles.bundle"]
  always:
    - name: Remove temporary guest Git bundle
      ansible.builtin.file:
        path: "{{ guest_bundle.path }}"
        state: absent
      when: guest_bundle.path is defined

- name: Install credential loader after dotfiles as dev in a clean environment
  ansible.builtin.command:
    argv: [sudo, -u, dev, -H, env, -i, HOME=/home/dev, USER=dev, LOGNAME=dev, PATH=/usr/bin:/bin, /bin/bash, "{{ policy_dir }}/setup-credentials.sh"]

- name: Install environment writer
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/environment.py"
    dest: "{{ policy_dir }}/setup-environment.py"
    owner: root
    group: root
    mode: '0644'

- name: Write declared environment and its loader as dev
  ansible.builtin.command:
    argv: [sudo, -u, dev, -H, env, -i, HOME=/home/dev, USER=dev, LOGNAME=dev, PATH=/usr/bin:/bin, /usr/bin/python3, "{{ policy_dir }}/setup-environment.py"]
    stdin: "{{ project_environment | to_json }}"
    expand_argument_vars: false

# Creation recipe. Paths are relative to this file. Never put secrets here.
# Significant changes are applied by creating a new VM, not reconfiguring one.
packages: []
environment: {}
dotfiles_repo: ""
dotfiles_install: install

# Optional initial policy and personal settings; empty means bundled defaults.
codex_requirements: ""
codex_config: ""
claude_managed_settings: ""
claude_config: ""

# Optional Bash scripts executed inside the guest after base setup.
system_script: ""
user_script: ""

# Prompt after provisioning; values never become part of the saved Lima recipe.
# Example: [{name: GH_TOKEN, description: "Token scoped to this project's repositories"}]
credentials: []

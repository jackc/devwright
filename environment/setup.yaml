- name: Configure the development VM over root SSH
  hosts: development
  remote_user: root
  gather_facts: true
  vars:
    repo_root: "{{ playbook_dir }}/.."
    policy_dir: /usr/local/share/devwright
  environment:
    PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    DEBIAN_FRONTEND: noninteractive
  pre_tasks:
    - name: Require the supported guest and established administrative connection
      ansible.builtin.assert:
        that:
          - ansible_facts.user_id == 'root'
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version == '26.04'
          - ansible_facts.architecture in ['aarch64', 'x86_64']
    - name: Confirm root login key exists
      ansible.builtin.command: test -s /root/.ssh/authorized_keys
      changed_when: false
  tasks:
    - ansible.builtin.import_tasks: tasks/base.yaml
    - ansible.builtin.import_tasks: tasks/agents.yaml
    - ansible.builtin.import_tasks: tasks/personal.yaml
    - ansible.builtin.import_tasks: tasks/verifier.yaml

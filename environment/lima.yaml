# Base VM configuration. environment/dev adds the saved system provisioning script.
# Use environment/dev create to get a fully configured development environment.
minimumLimaVersion: "2.2.0"
base:
  - template:_images/ubuntu-26.04

# Let Lima select the native architecture and default VM driver, as before.
cpus: 4
memory: 4GiB
disk: 60GiB

# Preserve devwright's boundary: no host mounts, automatic application port
# forwarding, guest agent, or bundled container runtime.
plain: true
mounts: []
containerd:
  system: false
  user: false
ssh:
  forwardAgent: false
  loadDotSSHPubKeys: false
propagateProxyEnv: false

# Lima creates the initial SSH account and supplies its own public login key.
# The system provisioner installs root's public login keys and removes dev's sudo.
user:
  name: dev
  comment: Shared development account
  home: /home/dev
  uid: 1000
  shell: /bin/bash
  passwordlessSudo: true

# The launcher fills this with provision.sh and the selected creation recipe.
provision: []

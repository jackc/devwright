[tools]
go = "1.27.1"
goreleaser = "2.18.1"

[env]
# Keep Go from automatically downloading a different toolchain.
GOTOOLCHAIN = "local"

[tasks.default]
description = "Build the host CLI"
depends = ["build"]

[tasks.guest]
description = "Build and compress Linux/macOS verifiers"
run = "bash scripts/build-guest.sh"

[tasks.build]
description = "Build the standalone project launcher (no guest artifacts)"
run = 'CGO_ENABLED=0 "${GO:-go}" build -trimpath -ldflags "-X main.version=${VERSION:-dev}" -o .build/devwright ./cmd/devwright'

[tasks.test]
description = "Run project launcher tests"
run = '"${GO:-go}" test ./internal/launch'

[tasks.test-legacy]
description = "Run all Go tests, including historical backend and verifier tests"
depends = ["guest"]
run = '"${GO:-go}" test ./...'

[tasks.check]
description = "Run tests, build, Go vet, and Bash syntax checks"
depends = ["test", "build"]
run = [
  '"${GO:-go}" vet ./internal/launch ./cmd/devwright',
  'goreleaser check',
  'for script in internal/launch/template/*.sh internal/launch/scripts/*.sh scripts/release.sh scripts/release-prepare.sh scripts/release-formula.sh; do bash -n "$script" || exit; done',
]

[tasks.release]
description = "Build snapshots or publish tagged releases with GoReleaser"
run = "bash scripts/release.sh"

[tasks.test-users-linux-vm]
description = "Run native-user acceptance in a disposable Ubuntu Lima VM"
run = "bash tests/users-linux-vm.sh"

name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install minitest --no-document
      - run: make check
      - run: go test -race ./...
      - name: Run the embedded recipe outside the checkout
        run: |
          executable="$PWD/.build/agent-vm"
          cd "$(mktemp -d)"
          "$executable" --version
          "$executable" render --cpus 8 --memory 8GiB > recipe.json
          ruby -rjson -e 'c = JSON.parse(File.read("recipe.json")); abort unless c["cpus"] == 8 && c["memory"] == "8GiB" && c["provision"] == []'

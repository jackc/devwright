name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - run: mise run check
      - run: go test -race ./...
      - name: Build archives, checksums, and Homebrew formula
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: mise run release "$RELEASE_VERSION" "$GITHUB_REPOSITORY"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: gh release create "$RELEASE_VERSION" .build/releases/"$RELEASE_VERSION"/* --verify-tag --draft --generate-notes --title "$RELEASE_VERSION"

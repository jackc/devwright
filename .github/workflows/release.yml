name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - run: mise run check
      - run: go test -race ./internal/launch
      - name: Publish release with GoReleaser
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run release publish

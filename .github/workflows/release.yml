name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install minitest --no-document
      - run: make check
      - run: go test -race ./...
      - name: Build archives, checksums, and Homebrew formula
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bash scripts/release.sh "$RELEASE_VERSION" "$GITHUB_REPOSITORY"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: gh release create "$RELEASE_VERSION" .build/releases/"$RELEASE_VERSION"/* --verify-tag --draft --generate-notes --title "$RELEASE_VERSION"
